map $http_user_agent $is_crawler {
    default 0;
    ~*Discordbot           1;
    ~*WhatsApp             1;
    ~*Twitterbot           1;
    ~*facebookexternalhit  1;
    ~*LinkedInBot          1;
    ~*Slackbot             1;
    ~*TelegramBot          1;
    ~*Googlebot            1;
    ~*bingbot              1;
    ~*Applebot             1;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 500M;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API to backend service in compose network
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # News detail pages: serve dynamic OG tags when a crawler requests them
    location ~ ^/news/([a-zA-Z0-9_-]+)$ {
        if ($is_crawler) {
            rewrite ^/news/(.+)$ /_og_proxy/news/$1 last;
        }
        try_files $uri /index.html;
    }

    # Internal location that proxies OG requests to the backend
    location ~ ^/_og_proxy/news/(.+)$ {
        internal;
        proxy_pass http://backend:8080/api/og/news/$1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri /index.html;
    }
}
